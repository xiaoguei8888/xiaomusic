<!doctype html>
<html lang="zh-CN">

<head>
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width" />
    <title>小爱音箱操控面板</title>
    <!-- 预加载字体文件，减少加载延迟 -->
    <link rel="preload" href="./materialicons.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./materialiconsoutlined.woff2" as="font" type="font/woff2" crossorigin>
    <script src="./jquery-3.7.1.min.js?version=1780982533"></script>
    <script src="./setting.js?version=1780982533"></script>
    <link rel="stylesheet" type="text/css" href="./bootstrap.min.css?version=1780982533" />
    <link rel="stylesheet" type="text/css" href="./app.css?version=1780982533" />

</head>

<body>
    <div class="setting-header" role="banner">
        <div class="header-inner">
            <h2>
                <span>小爱音箱设置面板</span>
                (<a id="setting-version" href="https://xdocs.hanxi.cc/issues/changelog.html" target="_blank">版本未知</a>)
            </h2>
            <div class="header-buttons">
                <button onclick="location.href = '/static/default/index.html'" aria-label="返回首页">
                    <span class="material-icons" aria-hidden="true">home</span>
                    <span>返回首页</span>
                </button>
                <button class="save-button" aria-label="保存配置">
                    <span class="material-icons" aria-hidden="true">save</span>
                    <span>保存配置</span>
                </button>
            </div>
        </div>
    </div>

    <div class="setting-container" id="setting" role="main">
        <section class="accordion-item" data-section="accordion-1">
            <button type="button" class="accordion-header" id="accordion-1-toggle" aria-expanded="false" aria-controls="accordion-1-content">
                <span class="accordion-title">设备选择</span>
                <span class="accordion-icon material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="accordion-content" id="accordion-1-content" role="region" aria-labelledby="accordion-1-toggle">
                <div class="accordion-body">
                    <div class="card-content">
                        <label for="mi_did">*勾选设备(至少勾选1个):</label>
                        <button class="option-inline mini-button" id="update-devices">获取设备列表(没自动更新时使用)</button>
                        <div id="mi_did" class="device-selection"></div>
                    </div>
                </div>
            </div>
        </section>
        <section class="accordion-item" data-section="accordion-2">
            <button type="button" class="accordion-header" id="accordion-2-toggle" aria-expanded="false" aria-controls="accordion-2-content">
                <span class="accordion-title">账号登录</span>
                <span class="accordion-icon material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="accordion-content" id="accordion-2-content" role="region" aria-labelledby="accordion-2-toggle">
                <div class="accordion-body">
                    <div class="card-content">
                        <div class="rows">
                            <div class="form-item">
                                <label for="login-status">登录状态:</label>
                                <div id="login-status" class="login-status">检测中…</div>
                            </div>
                            <div class="form-item">
                                <label>用米家 App 扫描二维码登录:</label>
                                <div id="qrcode-box" style="display:none; text-align:center;">
                                    <img id="qrcode-img" alt="登录二维码"
                                        style="width:220px;height:220px;background:#fff;padding:8px;border:1px solid #ddd;border-radius:8px;" />
                                    <div id="qrcode-status" style="margin-top:8px;color:#666;">正在获取二维码…</div>
                                </div>
                                <button class="option-inline mini-button" id="show-qrcode" type="button">
                                    <span class="material-icons" aria-hidden="true">qr_code</span>
                                    <span>刷新二维码</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="accordion-item" data-section="accordion-3">
            <button type="button" class="accordion-header" id="accordion-3-toggle" aria-expanded="false" aria-controls="accordion-3-content">
                <span class="accordion-title">服务地址</span>
                <span class="accordion-icon material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="accordion-content" id="accordion-3-content" role="region" aria-labelledby="accordion-3-toggle">
                <div class="accordion-body">
                    <div class="card-content">
                        <div class="rows">
                            <div class="form-item">
                                <label for="hostname" class="setting-label">*NAS的IP或域名:
                                    <button class="option-inline mini-button" id="auto-hostname" aria-label="自动填写主机名">
                                        <span class="material-icons" aria-hidden="true">auto_fix_high</span>
                                        <span>自动填</span>
                                    </button>
                                </label>
                                <input id="hostname" type="text" aria-required="true" />
                            </div>

                            <div class="form-item">
                                <label for="public_port" class="setting-label">*本地端口:
                                    <button class="option-inline mini-button" id="auto-port" aria-label="自动填写端口">
                                        <span class="material-icons" aria-hidden="true">auto_fix_high</span>
                                        <span>自动填</span>
                                    </button>
                                </label>
                                <input id="public_port" type="number" value="58090" aria-required="true" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="accordion-item" data-section="accordion-4">
            <button type="button" class="accordion-header" id="accordion-4-toggle" aria-expanded="false" aria-controls="accordion-4-content">
                <span class="accordion-title">音乐库与缓存</span>
                <span class="accordion-icon material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="accordion-content" id="accordion-4-content" role="region" aria-labelledby="accordion-4-toggle">
                <div class="accordion-body">
                    <div class="card-content">
                    <div class="rows">
                        <label for="music_path">音乐目录:</label>
                        <input id="music_path" type="text" value="music" />

                        <label for="conf_path">配置文件目录:</label>
                        <input id="conf_path" type="text" />

                        <label for="ffmpeg_location">ffmpeg路径:</label>
                        <input id="ffmpeg_location" type="text" value="./ffmpeg/bin" />

                        <label for="exclude_dirs">忽略目录(逗号分割):</label>
                        <input id="exclude_dirs" type="text" value="@eaDir,tmp" />

                        <label for="ignore_tag_dirs">不扫描标签信息目录(逗号分割):</label>
                        <input id="ignore_tag_dirs" type="text" value="" />

                        <label for="music_path_depth">目录深度:</label>
                        <input id="music_path_depth" type="number" value="10" />

                        <label for="recently_added_playlist_len">最近新增的歌曲数量:</label>
                        <input id="recently_added_playlist_len" type="number" value="50" />

                    </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="accordion-item" data-section="accordion-5">
            <button type="button" class="accordion-header" id="accordion-5-toggle" aria-expanded="false" aria-controls="accordion-5-content">
                <span class="accordion-title">播放控制</span>
                <span class="accordion-icon material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="accordion-content" id="accordion-5-content" role="region" aria-labelledby="accordion-5-toggle">
                <div class="accordion-body">
                    <div class="card-content">
                    <div class="rows">
                        <label for="delay_sec">下一首歌延迟播放秒数(支持负数):</label>
                        <input id="delay_sec" type="number" value="0" />

                        <label for="continue_play">启用触屏版歌曲封面及歌词，启用继续播放(可能导致兼容性问题):</label>
                        <select id="continue_play">
                            <option value="true">true</option>
                            <option value="false" selected>false</option>
                        </select>

                        <div style="display: flex; gap: 15px; align-items: flex-end; width: 100%;">

                            <div style="flex: 1; display: flex; flex-direction: column;">
                                <label for="use_music_audio_id" style="margin-bottom: 6px; display: block;">触屏版默认封面选择(触屏版歌曲封面设为true，才能选择):</label>
                                <select id="use_music_audio_id" style="width: 100%;">
                                    <option value="436490277987655" data-img="https://y.gtimg.cn/music/photo_new/T001R500x500M000000XFSu32aHi5w_7.jpg" selected>星河雀影</option>
                                    <option value="2284848025338642973" data-img="https://y.gtimg.cn/music/photo_new/T002R500x500M000003MUXTN0hp00B_1.jpg">鲸落</option>
                                    <option value="3032977774822294038" data-img="https://y.gtimg.cn/music/photo_new/T002R500x500M000000P52RF0ePrMh_1.jpg">仲夏涟漪</option>
                                    <option value="3573885250148762567" data-img="https://y.gtimg.cn/music/photo_new/T002R500x500M000001XSQmy0sbGRe_1.jpg">星辰妙漫</option>
                                    <option value="2821554561643067278" data-img="https://y.gtimg.cn/music/photo_new/T002R500x500M000003mtKhW0DFTMt_3.jpg">所念皆星河</option>
                                    <option value="1949968393125757902" data-img="https://y.gtimg.cn/music/photo_new/T002R500x500M000003zlK2H16UvnY_2.jpg">柳岸泊舟</option>
                                    <option value="1963040443250771008" data-img="https://y.gtimg.cn/music/photo_new/T002R500x500M000004HWTo41EPK3L_2.jpg">花冠少女</option>
                                    <option value="703059981413384476" data-img="https://y.gtimg.cn/music/photo_new/T002R500x500M000002OGzkK12zb2D_1.jpg">月夜</option>
                                    <option value="2182123779048604035" data-img="https://y.gtimg.cn/music/photo_new/T002R500x500M000001wIZl83iCjqo_1.jpg">橘子海</option>
                                    <option value="1299407089048748519" data-img="https://y.gtimg.cn/music/photo_new/T001R500x500M000002knSQ01Ts1vS_0.jpg">拾音者</option>
                                    <option value="2234266363446166675" data-img="https://y.gtimg.cn/music/photo_new/T002R500x500M000003TkJYk3nWUoB_2.jpg">唱片</option>
                                    <option value="224322594261696542" data-img="https://y.gtimg.cn/music/photo_new/T002R500x500M000003k0x5s4Ale28_1.jpg">音符</option>

                                </select>
                            </div>

                            <img id="cover_preview" src="" style="width: 64px; height: 64px; border-radius: 6px; object-fit: cover; border: 1px solid #ddd; display: none;" alt="预览" />
                        </div>

                        <label for="active_cmd">允许唤醒的命令:</label>
                        <input id="active_cmd" type="text"
                            value="play,set_play_type_rnd,playlocal,play_music_list,play_music_list_index,stop_after_minute,stop,play_next,play_prev,set_play_type_one,set_play_type_all,set_play_type_sin,set_play_type_seq,gen_music_list,add_to_favorites,del_from_favorites,cmd_del_music" />
                    </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="accordion-item" data-section="accordion-6">
            <button type="button" class="accordion-header" id="accordion-6-toggle" aria-expanded="false" aria-controls="accordion-6-content">
                <span class="accordion-title">搜索匹配</span>
                <span class="accordion-icon material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="accordion-content" id="accordion-6-content" role="region" aria-labelledby="accordion-6-toggle">
                <div class="accordion-body">
                    <div class="card-content">
                    <div class="rows">
                        <label for="fuzzy_match_cutoff">模糊匹配阈值(0.1~0.9):</label>
                        <input id="fuzzy_match_cutoff" type="number" value="0.6" />

                        <label for="enable_fuzzy_match">开启模糊搜索:</label>
                        <select id="enable_fuzzy_match">
                            <option value="true" selected>true</option>
                            <option value="false">false</option>
                        </select>

                        <label for="enable_multi_result_selection">开启多结果选择功能:</label>
                        <select id="enable_multi_result_selection" onchange="toggleMultiResultAction()">
                            <option value="true" selected>开启</option>
                            <option value="false">关闭</option>
                        </select>

                        <div id="multi_result_action_row">
                            <label for="multi_result_action">多结果处理:</label>
                            <select id="multi_result_action">
                                <option value="random" selected>随机播放</option>
                                <option value="first">从第一首开始播放</option>
                            </select>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="accordion-item" data-section="accordion-7">
            <button type="button" class="accordion-header" id="accordion-7-toggle" aria-expanded="false" aria-controls="accordion-7-content">
                <span class="accordion-title">音频处理</span>
                <span class="accordion-icon material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="accordion-content" id="accordion-7-content" role="region" aria-labelledby="accordion-7-toggle">
                <div class="accordion-body">
                    <div class="card-content">
                    <div class="rows">
                        <label for="get_duration_type">获取时长方式:</label>
                        <select id="get_duration_type">
                            <option value="ffprobe" selected>ffprobe</option>
                            <option value="mutagen">mutagen</option>
                        </select>

                        <label for="enable_save_tag">启用ID3标签写入文件:</label>
                        <select id="enable_save_tag">
                            <option value="true">true</option>
                            <option value="false" selected>false</option>
                        </select>
                    </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="accordion-item" data-section="accordion-8">
            <button type="button" class="accordion-header" id="accordion-8-toggle" aria-expanded="false" aria-controls="accordion-8-content">
                <span class="accordion-title">语音控制</span>
                <span class="accordion-icon material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="accordion-content" id="accordion-8-content" role="region" aria-labelledby="accordion-8-toggle">
                <div class="accordion-body">
                    <div class="card-content">
                    <div class="rows">
                        <label for="edge_tts_voice">Edge-TTS 语音角色:</label>
                        <select id="edge_tts_voice">
                            <option value="disable">不使用(默认)</option>
                            <option value="zh-CN-XiaoxiaoNeural">晓晓 (女声,温柔)</option>
                            <option value="zh-CN-XiaoyiNeural" selected>
                                晓伊 (女声,活泼)
                            </option>
                            <option value="zh-CN-YunjianNeural">云健 (男声,成熟)</option>
                            <option value="zh-CN-YunxiNeural">云希 (男声,阳光)</option>
                            <option value="zh-CN-YunxiaNeural">云夏 (男声,少年)</option>
                            <option value="zh-CN-YunyangNeural">云扬 (男声,新闻)</option>
                            <option value="zh-CN-liaoning-XiaobeiNeural">
                                晓北 (女声,东北)
                            </option>
                            <option value="zh-CN-shaanxi-XiaoniNeural">
                                晓妮 (女声,陕西)
                            </option>
                            <option value="zh-HK-HiuGaaiNeural">曉佳 (女声,粤语)</option>
                            <option value="zh-HK-HiuMaanNeural">曉曼 (女声,粤语)</option>
                            <option value="zh-HK-WanLungNeural">雲龍 (男声,粤语)</option>
                            <option value="zh-TW-HsiaoChenNeural">曉臻 (女声,台湾)</option>
                            <option value="zh-TW-YunJheNeural">雲哲 (男声,台湾)</option>
                            <option value="zh-TW-HsiaoYuNeural">曉雨 (女声,台湾)</option>
                        </select>

                        <label for="stop_tts_msg">停止提示音 (触屏音箱建议留空):</label>
                        <input id="stop_tts_msg" type="text" value="收到,再见" />

                        <label for="play_type_one_tts_msg">单曲循环提示音:</label>
                        <input id="play_type_one_tts_msg" type="text" value="已经设置为单曲循环" />

                        <label for="play_type_all_tts_msg">全部循环提示音:</label>
                        <input id="play_type_all_tts_msg" type="text" value="已经设置为全部循环" />

                        <label for="play_type_rnd_tts_msg">随机播放提示音:</label>
                        <input id="play_type_rnd_tts_msg" type="text" value="已经设置为随机播放" />

                        <label for="play_type_sin_tts_msg">单曲播放提示音:</label>
                        <input id="play_type_sin_tts_msg" type="text" value="已经设置为单曲播放" />

                        <label for="play_type_seq_tts_msg">顺序播放提示音:</label>
                        <input id="play_type_seq_tts_msg" type="text" value="已经设置为顺序播放" />

                        <label for="keywords_playlocal">播放本地歌曲口令:</label>
                        <input id="keywords_playlocal" type="text" value="播放本地歌曲,本地播放歌曲" />

                        <label for="keywords_play">播放歌曲口令:</label>
                        <input id="keywords_play" type="text" value="播放歌曲,放歌曲" />

                        <label for="keywords_playlist">播放列表口令:</label>
                        <input id="keywords_playlist" type="text" value="播放列表,播放歌单" />

                        <label for="keywords_stop">停止口令:</label>
                        <input id="keywords_stop" type="text" value="关机,暂停,停止,停止播放" />

                        <label for="enable_cmd_del_music">开启语音删除歌曲:</label>
                        <select id="enable_cmd_del_music">
                            <option value="true">true</option>
                            <option value="false" selected>false</option>
                        </select>
                    </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="accordion-item" data-section="accordion-9">
            <button type="button" class="accordion-header" id="accordion-9-toggle" aria-expanded="false" aria-controls="accordion-9-content">
                <span class="accordion-title">设备对话</span>
                <span class="accordion-icon material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="accordion-content" id="accordion-9-content" role="region" aria-labelledby="accordion-9-toggle">
                <div class="accordion-body">
                    <div class="card-content">
                    <div class="rows">
                        <label for="group_list">设备分组配置（不推荐，声音不同步）:<a href="https://xdocs.hanxi.cc/issues/366.html"
                                target="_blank">文档</a></label>
                        <input id="group_list" type="text" placeholder="did1:组名1,did2:组名1,did3:组名2" />

                        <label for="enable_pull_ask">获取对话记录:</label>
                        <select id="enable_pull_ask">
                            <option value="true">true</option>
                            <option value="false" selected>false</option>
                        </select>

                        <label for="pull_ask_sec">获取对话记录间隔(秒):</label>
                        <input id="pull_ask_sec" type="number" value="1" />

                        <label for="get_ask_by_mina">特殊型号获取对话记录:</label>
                        <select id="get_ask_by_mina">
                            <option value="true">true</option>
                            <option value="false" selected>false</option>
                        </select>
                    </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="accordion-item" data-section="accordion-10">
            <button type="button" class="accordion-header" id="accordion-10-toggle" aria-expanded="false" aria-controls="accordion-10-content">
                <span class="accordion-title">歌单</span>
                <span class="accordion-icon material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="accordion-content" id="accordion-10-content" role="region" aria-labelledby="accordion-10-toggle">
                <div class="accordion-body">
                    <div class="card-content">
                    <div class="rows">
                        <label for="custom_play_list_json">歌单内容:<a href="https://xdocs.hanxi.cc/issues/78.html"
                                target="_blank">格式文档</a></label>
                        <textarea id="custom_play_list_json" type="text"></textarea>
                    </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="accordion-item" data-section="accordion-11">
            <button type="button" class="accordion-header" id="accordion-11-toggle" aria-expanded="false" aria-controls="accordion-11-content">
                <span class="accordion-title">安全访问</span>
                <span class="accordion-icon material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="accordion-content" id="accordion-11-content" role="region" aria-labelledby="accordion-11-toggle">
                <div class="accordion-body">
                    <div class="card-content">
                    <div class="rows">
                        <label for="disable_httpauth">关闭控制台密码验证:</label>
                        <select id="disable_httpauth">
                            <option value="true" selected>true</option>
                            <option value="false">false</option>
                        </select>

                        <label for="httpauth_username">控制台账户:</label>
                        <input id="httpauth_username" type="text" value="" />

                        <label for="httpauth_password">控制台密码:</label>
                        <input id="httpauth_password" type="password" value="" />
                    </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="accordion-item" data-section="accordion-12">
            <button type="button" class="accordion-header" id="accordion-12-toggle" aria-expanded="false" aria-controls="accordion-12-content">
                <span class="accordion-title">其他</span>
                <span class="accordion-icon material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="accordion-content" id="accordion-12-content" role="region" aria-labelledby="accordion-12-toggle">
                <div class="accordion-body">
                    <div class="card-content">
                    <div class="rows">
                        <label for="verbose">是否开启调试日志:</label>
                        <select id="verbose">
                            <option value="true">true</option>
                            <option value="false" selected>false</option>
                        </select>

                        <label for="log_file">日志路径:</label>
                        <input id="log_file" type="text" value="xiaomusic.log.txt" />
                    </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="accordion-item" data-section="accordion-13">
