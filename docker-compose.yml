# XiaoMusic 部署编排（推荐用法，等价于 README 里的 docker run）
#
# 1) 在同一个目录建 .env（Compose 会自动读取）：
#      MI_USER=你的小米账号
#      MI_PASS=你的小米密码
#      MI_DID=你的设备DID
#      XIAOMUSIC_HOSTNAME=http://192.168.1.100   # 必须是音箱能访问到的局域网地址
# 2) docker compose up -d --build
# 3) 打开 http://<主机IP>:8090
#
# 注意：conf/setting.json 的优先级高于环境变量，若该文件里已有 port，
# 以文件为准；改动监听端口时请同时改 .env 的 XIAOMUSIC_PORT 和 setting.json。

services:
  xiaomusic:
    build:
      context: .
    image: xiaomusic:local
    container_name: xiaomusic
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      # Web 管理页与 API
      - "${XIAOMUSIC_PORT:-8090}:${XIAOMUSIC_PORT:-8090}"
      # 音箱拉取音频的端口，必须与 XIAOMUSIC_PUBLIC_PORT 一致。
      # 少了这一条会表现为「音箱放不出声」。
      - "${XIAOMUSIC_PUBLIC_PORT:-58090}:${XIAOMUSIC_PUBLIC_PORT:-58090}"
    volumes:
      # 不挂这两卷，重启后配置、歌单、tag 缓存全部丢失
      - ./conf:/app/conf
      - ./music:/app/music
    environment:
      TZ: Asia/Shanghai
      MI_USER: ${MI_USER:-}
      MI_PASS: ${MI_PASS:-}
      MI_DID: ${MI_DID:-}
      XIAOMUSIC_HOSTNAME: ${XIAOMUSIC_HOSTNAME:-http://192.168.2.5}
      XIAOMUSIC_PORT: ${XIAOMUSIC_PORT:-8090}
      XIAOMUSIC_PUBLIC_PORT: ${XIAOMUSIC_PUBLIC_PORT:-58090}
      XIAOMUSIC_MUSIC_PATH: /app/music
      XIAOMUSIC_CONF_PATH: /app/conf
      XIAOMUSIC_ENABLE_PULL_ASK: ${XIAOMUSIC_ENABLE_PULL_ASK:-true}
      XIAOMUSIC_DISABLE_HTTPAUTH: ${XIAOMUSIC_DISABLE_HTTPAUTH:-true}
      XIAOMUSIC_VERBOSE: ${XIAOMUSIC_VERBOSE:-false}
    # 镜像自带 HEALTHCHECK（scripts/healthcheck.py），这里不重复定义以免漂移
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
