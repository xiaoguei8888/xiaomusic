name: CI Workflow

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [amd64, arm64, armv7]
        include:
          - platform: amd64
            arch: amd64
          - platform: arm64
            arch: arm64
          - platform: armv7
            arch: arm/v7
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          context: .
          push: false
          load: true
          tags: xiaomusic:ci-${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Test Docker image for ${{ matrix.platform }}
        run: |
          docker run --rm xiaomusic:ci-${{ matrix.platform }} /app/.venv/bin/python3 /app/xiaomusic.py -h

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov
          pip install ruff || echo "ruff 安装失败，后续跳过 lint"

      - name: Ruff（不可用时跳过并说明）
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check . --exclude MiService
          else
            echo "ruff 不可用，跳过 lint"
          fi

      - name: Pytest with coverage
        run: python -m pytest -q --cov=xiaomusic --cov-report=term-missing

